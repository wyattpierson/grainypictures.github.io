<!--Fiji consists of 323 islands in the Pacific Ocean just over the International Dateline slightly below the equator in the Southern Hemisphere.  So its already tomorrow, and its summer.Because Fiji is tropical, you wouldnt know it was winter, spring, summer, or fall.  Its permanently hot and wet.  Days and nights are always about 12 hours long.Fiji has been an independent republic since 1970 with a parliamentary government.  It was a British colony before then.Early colonial-era missionaries pacified the warrior Fijians who had once practiced cannibalism. In fact Fiji was once called the Cannibal Isles.The British colonialists brought in Indian labor for the sugar plantations, so Fiji has a large minority Indo-Fijian population with its own culture.  They cannot own tribal land.English is a second (or even third, after Hindi) language in Fiji, but it is still indisputably the language in school.  And literacy rates, on paper at least, are surprisingly high.Taveuni is the third largest island in Fiji.  But its still only 25 miles long and 8 miles wide  a cigar shape.  A volcanic ridge down the middle divides the wild, unoccupied ocean side from the sheltered part where almost all the villages (and the 180 Meridian Cinema) are located.Taveunis population is reportedly about 10,000 in a string of villages along the one mostly dirt road.  Perhaps 2,000-3,000 residents are within 5km walking distance of the cinema.  The buses dont run after dark.  There are only 409 registered vehicles.Taveuni is the Garden Island, rural even by Fijian standards.  The cash crops are dalo (taro), copra (coconuts) and kava (a narcotic root).  There is no public electricity.  Merchants, ex-pats and a few others have generators.Fiji has one television station, Fiji 1.  Each Taveuni village has one television.  Everyone gathers on Friday evening for the top-rated show, Walker: Texas Ranger.Rupert Murdoch owns the major newspaper, the Fiji Times.  Its a good-hearted, unifying, liberal publication.  It has no film critic.The 180 Meridian Cinema was built by Ambaran Dayaram and opened in 1954 with Burt Lancasters His Majesty OKeefe, filmed in Fiji.  Ambarans middle son Dhansukh Lal ran the theater for 30 years before  emigrating to New Zealand in 2002.Movies used to cost $2 Fijian which used to be about $1 U.S.  Attendance had sagged due to video (available to the wealthy Indians) and a depressed local agricultural economy. In the 60s, aside from the Hindi films, John Wayne, Elvis Presley and The Sound of Music ruled.  In recent times, old school action idols like Van Damme, Seagal, Stallone & Norris are still gods.--><OBJECT classid="clsid:D27CDB6E-AE6D-11cf-96B8-444553540000"
